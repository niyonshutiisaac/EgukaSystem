# Nginx reverse proxy / load balancer for EgukaSystem API
# Terminates TLS, distributes requests across stateless API replicas,
# checks health before routing, and enforces sane limits.

upstream egukasystem_api {
    # Docker compose service DNS names — scaled via `docker compose up --scale api=4`
    server api:3000 max_fails=3 fail_timeout=10s;
    server api:3000 max_fails=3 fail_timeout=10s;
    keepalive 32;
}

server {
    listen 80;
    server_name api.egukasystem.com;

    # ---- TLS (replace with your certs) ----
    # listen 443 ssl http2;
    # ssl_certificate     /etc/nginx/certs/fullchain.pem;
    # ssl_certificate_key /etc/nginx/certs/privkey.pem;
    # ssl_protocols TLSv1.2 TLSv1.3;

    client_max_body_size 2m;

    gzip on;
    gzip_types application/json application/javascript text/css;
    gzip_min_length 1024;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;

    # ---- Health checks hit nginx directly, no load balancing ----
    location = /healthz {
        access_log off;
        return 200 "ok\n";
    }

    location /api/ {
        proxy_pass http://egukasystem_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_read_timeout 60s;
        proxy_connect_timeout 5s;
        proxy_next_upstream error timeout http_502 http_503 http_504;
    }

    location /docs {
        proxy_pass http://egukasystem_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}